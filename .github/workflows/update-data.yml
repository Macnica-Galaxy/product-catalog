name: Auto Update Product Data

on:
  schedule:
    # 每天台灣時間 00:00 (即 UTC 16:00) 自動檢查並更新
    - cron: '0 16 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上隨時手動點擊按鈕觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 GitHub Actions 自動提交並推送變更到 Repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and Validate Data from Google Sheets
        run: |
          node -e "
            const https = require('https');
            const fs = require('fs');

            const url = 'https://script.google.com/macros/s/AKfycbwfn_bO64Jso9QkpmSRWfXTvEIIh8Q4Ovy0uhqycJRhV1j5Dt-9jJWpjqTvi-lFTB4o/exec';

            function fetchUrl(targetUrl) {
              return new Promise((resolve, reject) => {
                https.get(targetUrl, (res) => {
                  if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                    return resolve(fetchUrl(res.headers.location));
                  }
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }

            async function run() {
              console.log('正在連線 Google Apps Script 取得最新產品目錄...');
              const rawText = await fetchUrl(url);
              const json = JSON.parse(rawText);

              if (json.error || !json.rows || !Array.isArray(json.rows) || json.rows.length === 0) {
                throw new Error('取得之資料為空或格式不符，中止更新以保護現有 data.json！');
              }

              console.log('成功取得 ' + json.rows.length + ' 筆產品資料。');
              fs.writeFileSync('data.json', JSON.stringify(json, null, 2) + '\n', 'utf8');
              console.log('已成功寫入 data.json。');
            }

            run().catch(err => {
              console.error('更新失敗:', err.message);
              process.exit(1);
            });
          "

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data.json; then
            echo "資料與現有 data.json 相同，無需更新。"
          else
            echo "偵測到產品資料有變更，正在 Commit 並 Push 至 Repository..."
            git add data.json
            git commit -m "Auto-update data.json from Google Sheets [skip ci]"
            git push
          fi

